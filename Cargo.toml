[package]
name = "floodwall"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "A control plane for high-volume, agent-driven DevOps - admission control, a policy verification gate, and a tamper-evident decision ledger."
repository = "https://github.com/erphq/floodwall"
readme = "README.md"
keywords = ["devops", "control-plane", "agents", "admission-control", "policy"]
categories = ["concurrency", "command-line-utilities"]

[workspace]
members = ["wasm"]

[dependencies]

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "floodwall"
path = "src/bin/floodwall.rs"

[profile.release]
# The plane runs as WebAssembly in Floodwall Cloud: a panic there ends the
# instance, which the Durable Object rebuilds from its ledger.
panic = "abort"
opt-level = "s"
lto = true
